name: Read-only site monitor

on:
  schedule:
    # One daily trigger. The endpoint accepts scheduler delays and deduplicates
    # by the current Chicago calendar date.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: millstadt-ai-site-monitor
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the protected monitor endpoint
        env:
          CRON_SECRET: ${{ secrets.AI_MONITOR_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "AI_MONITOR_CRON_SECRET is not configured."
            exit 1
          fi

          body="$(curl --silent --show-error --fail-with-body \
            --max-time 240 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://www.millstadtems.org/api/cron/ai-monitor")"

          node -e '
            const body = JSON.parse(process.argv[1]);
            const nightlyStatus = body.nightly?.status;
            const nightlyReason = body.nightly?.reason;
            const nightlySucceeded = nightlyStatus === "completed"
              || (nightlyStatus === "skipped" && nightlyReason === "already_processed");
            if (body.error || body.ok !== true || body.reportOnly !== true || !nightlySucceeded) {
              console.error("The daily read-only security scan did not complete.", JSON.stringify(body));
              process.exit(1);
            }
            console.log(JSON.stringify({
              ok: true,
              reportOnly: true,
              nightly: nightlyStatus,
              nightlyReason,
              weekly: body.weekly?.status ?? "skipped",
            }));
          ' "$body"
