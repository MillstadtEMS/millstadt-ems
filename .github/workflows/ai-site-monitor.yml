name: Read-only site monitor

on:
  schedule:
    - cron: "59 4 * * *"
    - cron: "59 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: millstadt-ai-site-monitor
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the protected monitor endpoint
        env:
          CRON_SECRET: ${{ secrets.AI_MONITOR_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "AI_MONITOR_CRON_SECRET is not configured."
            exit 1
          fi

          body="$(curl --silent --show-error --fail-with-body \
            --max-time 240 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://www.millstadtems.org/api/cron/ai-monitor")"

          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.error || body.ok !== true) process.exit(1);
            console.log(JSON.stringify({
              ok: true,
              reportOnly: body.reportOnly === true,
              nightly: body.nightly?.status ?? body.reason ?? "skipped",
              weekly: body.weekly?.status ?? "skipped",
            }));
          ' "$body"
