name: Protected public forms

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify protected public-form behavior
        run: npm run test:public-forms
      - name: Verify contract, mutation checks and protected fingerprints
        run: npm run protect:public-forms
